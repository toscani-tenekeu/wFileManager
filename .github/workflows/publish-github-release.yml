name: Publish GitHub release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(jq -r '.version // empty' package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the canonical archive
        if: steps.existing.outputs.exists != 'true'
        id: archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          ARCHIVE="wfilemanager-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="wFileManager-$VERSION/" -o "$ARCHIVE" "$RELEASE_REF"
          SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c%s "$ARCHIVE")"
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" > SHA256SUMS
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          SIZE: ${{ steps.archive.outputs.size }}
        run: |
          cat > release-notes.md <<EOF
          wFileManager $VERSION is the Community-only release.

          - Removes Pro sales, licences, billing and managed backups.
          - Stores application data locally in SQLite.
          - Retires legacy Pro installations through an authenticated, fail-closed transition.
          - Keeps verified updates and automatic rollback.

          SHA-256: \`$SHA256\`
          Size: \`$SIZE bytes\`
          EOF

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE#Canonical verified source archive" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REF" \
            --title "wFileManager $VERSION" \
            --notes-file release-notes.md \
            --latest
